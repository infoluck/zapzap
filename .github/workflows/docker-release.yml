name: CI/CD Pipeline - Lint, Docker & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_deploy:
        description: 'Disparar webhook de deploy após o push'
        required: false
        type: boolean
        default: true

# Um push novo cancela o pipeline anterior ainda em andamento
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # Tudo em um único job: uma máquina faz lint, imagem e deploy em sequência
  release:
    name: Lint, Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 1. Verificação de tipos ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # O postinstall roda "prisma generate", necessário para o tsc
      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run lint

      # ---------- 2. Imagem Docker ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tags
        id: docker_tags
        run: |
          IMAGE="infoluck/image"
          VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          TAGS="$IMAGE:zapzap-latest,$IMAGE:zapzap-${VERSION:-1.0.0-alpha}"
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT
          echo "Generated tags: $TAGS"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 3. Deploy no Easypanel ----------
      - name: Trigger Deploy Webhook
        if: ${{ inputs.trigger_deploy != false }}
        env:
          TARGET_URL: ${{ vars.DEPLOY_PROD_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ Variável DEPLOY_PROD_URL não configurada (pulando deploy)."
            echo "### ⚠️ Deploy Easypanel Pulado: DEPLOY_PROD_URL não configurada" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Disparando POST no webhook do Easypanel..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$TARGET_URL" || echo "000")
          echo "Status HTTP retornado: $HTTP_STATUS"
          cat response.txt || true
          echo ""

          echo "### 🚀 Deploy Easypanel (PRODUCAO)" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem:** \`${{ steps.docker_tags.outputs.TAGS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status HTTP:** \`$HTTP_STATUS\`" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Webhook disparado com sucesso!"
            echo "- **Resultado:** ✅ Sucesso" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Falha ao acionar webhook (HTTP $HTTP_STATUS)"
            echo "- **Resultado:** ❌ Erro (HTTP $HTTP_STATUS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
